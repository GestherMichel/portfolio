<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesther Michel — Développeur logiciel et Web</title>
    <meta
      name="description"
      content="Portfolio de Gesther Michel, finissant en Techniques de l'informatique à Montréal. À la recherche d'un stage en développement logiciel et Web, hiver 2027."
    />
    <meta name="theme-color" content="#000000" />

    <!-- Icône de l'onglet -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Aperçu quand on partage le lien (LinkedIn, Messenger, Slack…).
         og:url et og:image doivent être des adresses COMPLÈTES : les sites
         qui lisent ces balises ne connaissent pas l'adresse de départ. -->
    <link rel="canonical" href="https://gesther-michel-portfolio.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gesther Michel — Développeur logiciel et Web" />
    <meta
      property="og:description"
      content="Finissant en Techniques de l'informatique à Montréal. À la recherche d'un stage en développement logiciel et Web, hiver 2027."
    />
    <meta property="og:url" content="https://gesther-michel-portfolio.vercel.app/" />
    <meta property="og:image" content="https://gesther-michel-portfolio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Polices Google : Inter (texte) et Anton (grands titres condensés) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React monte toute l'application dans cette div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
